apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ntu-ingress
  namespace: ntu
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "ntu-static-ip"
    networking.gke.io/managed-certificates: "ntu-cert"
spec:
  rules:
  - host: ntu.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ntu-frontend
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: ntu-backend
            port:
              number: 8000
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: ntu-cert
  namespace: ntu
spec:
  domains:
  - ntu.example.com
