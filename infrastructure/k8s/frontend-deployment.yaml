apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntu-frontend
  namespace: ntu
  labels:
    app: ntu-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ntu-frontend
  template:
    metadata:
      labels:
        app: ntu-frontend
    spec:
      containers:
      - name: ntu-frontend
        image: gcr.io/${GCP_PROJECT_ID}/ntu-frontend:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ntu-frontend
  namespace: ntu
  labels:
    app: ntu-frontend
spec:
  type: ClusterIP
  selector:
    app: ntu-frontend
  ports:
  - port: 80
    targetPort: 80
